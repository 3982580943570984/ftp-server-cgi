<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FTP Клиент</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>

  <body>
    <div id="login-form-container">
      <div id="login-form">
        <h2>Вход в FTP</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="host">Хост:</label>
            <input type="text" id="host" value="localhost" required />
          </div>
          <div class="form-group">
            <label for="port">Порт:</label>
            <input type="number" id="port" value="21" required />
          </div>
          <div class="form-group">
            <label for="username">Имя пользователя:</label>
            <input type="text" id="username" value="username" required />
          </div>
          <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" value="password" required />
          </div>
          <button type="submit">Войти</button>
        </form>
      </div>
    </div>

    <div id="main-content" style="display: none">
      <h1>Текущая директория: <span id="directory"></span></h1>

      <table class="listing-table">
        <thead>
          <tr>
            <th class="name-col" data-column="name">Имя</th>
            <th class="type-col" data-column="type">Тип</th>
            <th class="perm-col" data-column="permissions">Права</th>
            <th class="owner-col" data-column="owner">Владелец</th>
            <th class="group-col" data-column="group">Группа</th>
            <th class="size-col" data-column="size">Размер</th>
            <th class="date-col" data-column="date">Дата</th>
            <th class="actions-col">Действия</th>
          </tr>
        </thead>
        <tbody id="listing"></tbody>
      </table>

      <input type="file" id="hidden-upload-input" style="display: none" />
    </div>
  </body>
</html>
